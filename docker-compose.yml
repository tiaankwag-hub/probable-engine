services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: risk_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot init job: runs migrations then seeds roles/users/categories/
  # scoring config plus the synthetic demo risks (database/seed/seed.py is
  # idempotent, so re-running this on every `up` is safe and a no-op after
  # the first run). api/worker wait for this to *finish*, not just start.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["sh", "-c", "cd apps/api && alembic upgrade head && cd /srv && python database/seed/seed.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/risk_platform
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/risk_platform
      STORAGE_ROOT: /srv/.data/storage
      CORS_ALLOW_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/srv/.data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/risk_platform
      STORAGE_ROOT: /srv/.data/storage
      WORKER_POLL_INTERVAL_SECONDS: "2"
    volumes:
      - storage_data:/srv/.data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  storage_data:
